
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#101827;
 color:white;
}
header{
 background:#17243a;
 padding:20px;
 text-align:center;
 border-bottom:1px solid #30415e;
}
header h1{margin:0;color:#60a5fa}
header p{color:#cbd5e1}
main{
 max-width:800px;
 margin:auto;
 padding:15px;
}
#chat{
 height:55vh;
 min-height:300px;
 overflow-y:auto;
 background:#17243a;
 border-radius:15px;
 padding:15px;
}
.message{
 padding:12px;
 margin:10px 0;
 border-radius:12px;
 line-height:1.5;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{
 background:#2563eb;
 margin-left:15%;
}
.ai{
 background:#293951;
 margin-right:15%;
}
form{
 display:flex;
 gap:8px;
 margin-top:15px;
}
input{
 flex:1;
 min-width:0;
 padding:15px;
 border-radius:10px;
 border:0;
 font-size:16px;
}
button{
 border:0;
 border-radius:10px;
 padding:13px 17px;
 background:#2563eb;
 color:white;
 font-size:15px;
 cursor:pointer;
}
button:disabled{opacity:.5}
.controls{
 display:flex;
 gap:10px;
 margin-top:12px;
 flex-wrap:wrap;
}
#status{
 color:#93c5fd;
 margin-top:12px;
 min-height:22px;
}
footer{
 text-align:center;
 padding:20px;
 color:#94a3b8;
}
</style>
</head>
<body>

<header>
<h1>🌍 Universal AI</h1>
<p>Ko‘p tilli sun’iy intellekt yordamchisi</p>
</header>

<main>
<div id="chat">
 <div class="message ai">
 Salom! Men Universal AI.
 Sizga qanday yordam bera olaman?
 </div>
</div>

<form id="form">
 <input id="question"
 placeholder="Xabaringizni yozing..."
 autocomplete="off"
 required>
 <button id="sendButton" type="submit">Yuborish</button>
</form>

<div class="controls">
 <button type="button" id="micButton">🎙️ Gapirish</button>
 <button type="button" id="voiceButton">🔊 Ovozni yoqish</button>
</div>

<div id="status">Universal AI tayyor.</div>
</main>

<footer>Universal AI © 2026</footer>

<script>
const chat=document.getElementById("chat");
const form=document.getElementById("form");
const question=document.getElementById("question");
const statusText=document.getElementById("status");
const sendButton=document.getElementById("sendButton");
const micButton=document.getElementById("micButton");
const voiceButton=document.getElementById("voiceButton");

let voiceEnabled=true;

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function speak(text){
 if(!voiceEnabled || !("speechSynthesis" in window))return;

 speechSynthesis.cancel();

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="uz-UZ";
 utterance.rate=1;
 utterance.pitch=0.85;

 const voices=speechSynthesis.getVoices();
 const maleVoice=voices.find(v=>
  /male|david|mark|daniel/i.test(v.name)
 );

 if(maleVoice) utterance.voice=maleVoice;

 speechSynthesis.speak(utterance);
}

form.addEventListener("submit",async function(e){
 e.preventDefault();

 const message=question.value.trim();
 if(!message)return;

 addMessage(message,"user");
 question.value="";
 sendButton.disabled=true;
 statusText.textContent="AI javob tayyorlamoqda...";

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:message})
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error || "Server xatoligi");
  }

  const answer=
   data.reply ||
   data.message ||
   data.output_text ||
   data.response ||
   "Javob olinmadi.";

  addMessage(answer,"ai");
  speak(answer);
  statusText.textContent="Tayyor.";

 }catch(error){
  addMessage("Xatolik: "+error.message,"ai");
  statusText.textContent="Server bilan bog‘lanib bo‘lmadi.";
 }finally{
  sendButton.disabled=false;
  question.focus();
 }
});

const SpeechRecognition=
 window.SpeechRecognition ||
 window.webkitSpeechRecognition;

let recognition=null;

if(SpeechRecognition){
 recognition=new SpeechRecognition();
 recognition.lang="uz-UZ";
 recognition.continuous=false;
 recognition.interimResults=false;

 recognition.onstart=()=>{
  statusText.textContent="Sizni tinglayapman...";
 };

 recognition.onresult=(event)=>{
  question.value=event.results[0][0].transcript;
  statusText.textContent="Xabar tayyor. Yuborishingiz mumkin.";
 };

 recognition.onerror=()=>{
  statusText.textContent="Mikrofon xatoligi.";
 };

 recognition.onend=()=>{
  micButton.textContent="🎙️ Gapirish";
 };
}

micButton.addEventListener("click",()=>{
 if(!recognition){
  statusText.textContent="Bu brauzer ovozli kiritishni qo‘llamaydi.";
  return;
 }

 try{
  if(micButton.textContent.includes("Gapirish")){
   recognition.start();
   micButton.textContent="⏹️ To‘xtatish";
  }else{
   recognition.stop();
   micButton.textContent="🎙️ Gapirish";
  }
 }catch(error){
  statusText.textContent="Mikrofonni qayta ishga tushiring.";
 }
});

voiceButton.addEventListener("click",()=>{
 voiceEnabled=!voiceEnabled;

 if(!voiceEnabled){
  speechSynthesis.cancel();
  voiceButton.textContent="🔇 Ovoz o‘chiq";
 }else{
  voiceButton.textContent="🔊 Ovoz yoqilgan";
  statusText.textContent="Ovoz yoqildi.";
 }
});
</script>

</body>
</html>
