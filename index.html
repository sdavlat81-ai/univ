
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152e">
<title>Universal AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 color:#eef6ff;
 background:radial-gradient(circle at 50% 15%,#153b70,#091a35 48%,#050d1d);
 min-height:100vh;
}
header{
 padding:20px;
 text-align:center;
 border-bottom:1px solid #24466c;
 background:#09172ee8;
}
.logo{
 font-size:27px;
 font-weight:bold;
 color:#64caff;
 letter-spacing:1px;
}
header p{color:#a8c5e6;font-size:13px}
main{max-width:850px;margin:auto;padding:18px}
.panel{
 background:#102746cc;
 border:1px solid #28517c;
 border-radius:20px;
 padding:18px;
 box-shadow:0 10px 40px #0005;
}
.assistant{
 text-align:center;
 padding:15px 0 20px;
}
.orb{
 width:130px;
 height:130px;
 margin:auto;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:53px;
 background:radial-gradient(circle,#40bfff,#1261bd 55%,#09244c);
 box-shadow:0 0 25px #168dff,0 0 65px #0875ff55;
 border:2px solid #7bd6ff;
}
.orb.listening{
 animation:pulse 1.2s infinite;
}
@keyframes pulse{
 50%{transform:scale(1.09);box-shadow:0 0 45px #20c8ff,0 0 90px #168dff}
}
.assistant h2{margin:17px 0 5px}
.assistant p{color:#a9c9ed;font-size:14px}
#chat{
 height:310px;
 overflow-y:auto;
 padding:12px;
 background:#071a32;
 border:1px solid #24476e;
 border-radius:15px;
}
.message{
 padding:12px 14px;
 margin:10px 0;
 border-radius:14px;
 line-height:1.55;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{
 background:#1767c4;
 margin-left:12%;
}
.ai{
 background:#193654;
 margin-right:12%;
 border:1px solid #31577b;
}
form{
 display:flex;
 gap:8px;
 margin-top:13px;
}
input{
 flex:1;
 min-width:0;
 padding:15px;
 border-radius:12px;
 border:1px solid #37618b;
 background:#091a30;
 color:white;
 font-size:16px;
 outline:none;
}
button{
 border:0;
 border-radius:12px;
 padding:13px 16px;
 background:linear-gradient(135deg,#168dff,#0751b5);
 color:white;
 font-size:15px;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.5}
.controls{
 display:flex;
 justify-content:center;
 gap:10px;
 flex-wrap:wrap;
 margin-top:15px;
}
.controls button{min-width:145px}
#status{
 text-align:center;
 color:#72caff;
 margin:15px 0 5px;
 min-height:22px;
 font-size:14px;
}
footer{
 text-align:center;
 color:#7595b8;
 padding:20px;
 font-size:12px;
}
@media(max-width:500px){
 main{padding:12px}
 .orb{width:110px;height:110px;font-size:45px}
 #chat{height:300px}
 form button{padding:12px}
}
</style>
</head>
<body>

<header>
 <div class="logo">🌍 UNIVERSAL AI</div>
 <p>YOUR INTELLIGENT AI ASSISTANT</p>
</header>

<main>
 <div class="panel">

  <section class="assistant">
   <div class="orb" id="orb">🤖</div>
   <h2>Universal AI</h2>
   <p>Men sizni tinglashga va yordam berishga tayyorman.</p>
  </section>

  <div id="chat">
   <div class="message ai">
    Salom! Men Universal AI.
    Menga yozishingiz yoki ovoz orqali savol berishingiz mumkin.
   </div>
  </div>

  <form id="form">
   <input id="question"
    placeholder="Universal AI ga yozing..."
    autocomplete="off"
    required>
   <button id="sendButton" type="submit">➤</button>
  </form>

  <div class="controls">
   <button type="button" id="micButton">🎙️ Gapirish</button>
   <button type="button" id="voiceButton">🔊 Ovoz yoqilgan</button>
   <button type="button" id="stopButton">⏹ To‘xtatish</button>
  </div>

  <div id="status">● Universal AI tayyor</div>

 </div>
</main>

<footer>
 Universal AI © 2026 | Artificial Intelligence
</footer>

<script>
const chat=document.getElementById("chat");
const form=document.getElementById("form");
const question=document.getElementById("question");
const statusText=document.getElementById("status");
const sendButton=document.getElementById("sendButton");
const micButton=document.getElementById("micButton");
const voiceButton=document.getElementById("voiceButton");
const stopButton=document.getElementById("stopButton");
const orb=document.getElementById("orb");

let voiceEnabled=true;
let recognition=null;
let listening=false;
let speaking=false;

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function speak(text){
 if(!voiceEnabled || !("speechSynthesis" in window))return;

 speechSynthesis.cancel();

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="uz-UZ";
 utterance.rate=0.95;
 utterance.pitch=0.85;

 const voices=speechSynthesis.getVoices();
 const male=voices.find(v=>
  /male|david|mark|daniel/i.test(v.name)
 );

 if(male)utterance.voice=male;

 utterance.onstart=()=>{
  speaking=true;
  statusText.textContent="🔊 AI gapiryapti...";
  orb.classList.add("listening");
 };

 utterance.onend=()=>{
  speaking=false;
  orb.classList.remove("listening");
  statusText.textContent="● Universal AI tayyor";
 };

 utterance.onerror=()=>{
  speaking=false;
  orb.classList.remove("listening");
 };

 speechSynthesis.speak(utterance);
}

async function sendMessage(message){
 if(!message || sendButton.disabled)return;

 if(speechSynthesis) speechSynthesis.cancel();

 addMessage(message,"user");
 question.value="";
 sendButton.disabled=true;
 statusText.textContent="AI javob tayyorlamoqda...";

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error || "Server xatosi");
  }

  const answer=data.reply ||
    data.message ||
    data.output_text ||
    "Javob olinmadi.";

  addMessage(answer,"ai");
  speak(answer);

  if(!voiceEnabled){
   statusText.textContent="● Javob tayyor";
  }

 }catch(error){
  addMessage("Xatolik: "+error.message,"ai");
  statusText.textContent="Server bilan aloqa xatosi.";
 }finally{
  sendButton.disabled=false;
 }
}

form.addEventListener("submit",e=>{
 e.preventDefault();
 sendMessage(question.value.trim());
});

// Ovozli tanish
const SpeechRecognition=
 window.SpeechRecognition ||
 window.webkitSpeechRecognition;

if(SpeechRecognition){
 recognition=new SpeechRecognition();
 recognition.lang="uz-UZ";
 recognition.continuous=false;
 recognition.interimResults=false;

 recognition.onstart=()=>{
  listening=true;
  micButton.textContent="⏹ Tinglash...";
  orb.classList.add("listening");
  statusText.textContent="🎙️ Sizni tinglayapman...";
 };

 recognition.onresult=event=>{
  const text=event.results[0][0].transcript;
  question.value=text;
  listening=false;
  orb.classList.remove("listening");
  sendMessage(text);
 };

 recognition.onerror=event=>{
  listening=false;
  orb.classList.remove("listening");
  micButton.textContent="🎙️ Gapirish";
  statusText.textContent=
   event.error==="not-allowed"
   ? "Mikrofon ruxsatini yoqing."
   : "Ovozli tanish xatosi: "+event.error;
 };

 recognition.onend=()=>{
  listening=false;
  micButton.textContent="🎙️ Gapirish";
  orb.classList.remove("listening");
 };
}

micButton.addEventListener("click",()=>{
 if(!recognition){
  statusText.textContent=
   "Brauzeringiz ovozli tanishni qo‘llamaydi.";
  return;
 }

 if(listening){
  recognition.stop();
  return;
 }

 try{
  if(speechSynthesis)speechSynthesis.cancel();
  recognition.start();
 }catch(error){
  statusText.textContent="Mikrofonni qayta yoqing.";
 }
});

voiceButton.addEventListener("click",()=>{
 voiceEnabled=!voiceEnabled;

 if(!voiceEnabled){
  speechSynthesis.cancel();
  voiceButton.textContent="🔇 Ovoz o‘chiq";
 }else{
  voiceButton.textContent="🔊 Ovoz yoqilgan";
  statusText.textContent="Ovoz yoqildi.";
 }
});

stopButton.addEventListener("click",()=>{
 if(listening && recognition){
  recognition.stop();
 }
 if(speechSynthesis){
  speechSynthesis.cancel();
 }
 listening=false;
 speaking=false;
 orb.classList.remove("listening");
 micButton.textContent="🎙️ Gapirish";
 statusText.textContent="Suhbat to‘xtatildi.";
});

if("speechSynthesis" in window){
 speechSynthesis.getVoices();
 speechSynthesis.onvoiceschanged=()=>{
  speechSynthesis.getVoices();
 };
}
</script>
</body>
</html>
