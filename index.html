
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080d18;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:22px;
 text-align:center;
 border-bottom:1px solid #26334a;
}
.logo{
 color:#d8b45a;
 font-size:29px;
 font-weight:bold;
}
.sub{color:#9aa9bd;margin-top:8px}
main{
 max-width:700px;
 margin:40px auto;
 padding:20px;
}
.welcome{
 text-align:center;
 padding:35px 10px;
}
.welcome h1{font-size:30px}
.welcome span{color:#e2bd65}
.chat{
 min-height:280px;
 padding:18px;
 background:#111b2c;
 border:1px solid #33445e;
 border-radius:18px;
}
.message{
 background:#1c2b42;
 padding:14px;
 border-radius:12px;
 margin:12px 0;
 line-height:1.6;
}
form{
 display:flex;
 gap:8px;
 margin-top:15px;
}
input{
 flex:1;
 min-width:0;
 padding:15px;
 border-radius:12px;
 border:1px solid #455674;
 background:#111b2c;
 color:white;
 font-size:16px;
}
button{
 background:#d8b45a;
 border:0;
 border-radius:12px;
 padding:14px 18px;
 font-weight:bold;
}
footer{text-align:center;color:#8996a8;padding:25px}
</style>
</head>
<body>
<header>
 <div class="logo">✦ UNIVERSAL AI</div>
 <div class="sub">Your Universal Intelligent Assistant</div>
</header>
<main>
 <section class="welcome">
  <h1>Salom! Men <span>Universal AI</span></h1>
  <p>Sizning aqlli universal yordamchingiz.</p>
  <p>Ask me anything. Any language.</p>
 </section>
 <div class="chat" id="chat">
  <div class="message">
   Assalomu alaykum! Men Universal AI.
   Sizga qanday yordam bera olaman?
  </div>
 </div>
 <form id="form">
  <input id="question" placeholder="Xabaringizni yozing..." required>
  <button type="submit">Yuborish</button>
 </form>
</main>
<footer>© 2026 Universal AI</footer>
<script>
const form = document.getElementById('form');
const chat = document.getElementById('chat');
const input = document.getElementById('question');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const message = input.value.trim();
  if (!message) return;

  const user = document.createElement('div');
  user.className = 'message';
  user.textContent = 'Siz: ' + message;
  chat.appendChild(user);

  input.value = '';

  const loading = document.createElement('div');
  loading.className = 'message';
  loading.textContent = 'Universal AI javob tayyorlamoqda...';
  chat.appendChild(loading);

  try {
    const response = await fetch(
      '/.netlify/functions/chat',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ message })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'Server xatosi');
    }

    loading.textContent = data.reply;
  } catch (error) {
    loading.textContent =
      'Server bilan bog‘lanishda xatolik: ' + error.message;
  }
});
</script>
