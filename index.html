
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  text-align: center;
  border-bottom: 1px solid #26334a;
}

.logo {
  color: #d8b45a;
  font-size: 29px;
  font-weight: bold;
}

.sub {
  color: #9aa9bd;
  margin-top: 8px;
}

main {
  max-width: 700px;
  margin: 30px auto;
  padding: 15px;
}

.welcome {
  text-align: center;
  padding: 25px 10px;
}

.welcome h1 {
  font-size: 29px;
}

.welcome span {
  color: #e2bd65;
}

.chat {
  min-height: 300px;
  max-height: 55vh;
  overflow-y: auto;
  padding: 18px;
  background: #111b2c;
  border: 1px solid #33445e;
  border-radius: 18px;
}

.message {
  background: #1c2b42;
  padding: 14px;
  border-radius: 12px;
  margin: 12px 0;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

form {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #455674;
  background: #111b2c;
  color: white;
  font-size: 16px;
}

button {
  background: #d8b45a;
  color: #101827;
  border: 0;
  border-radius: 12px;
  padding: 13px 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

.voice-controls {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.voice-controls button {
  flex: 1;
}

#micButton {
  background: #d8b45a;
}

#voiceButton {
  background: #263954;
  color: white;
}

.status {
  text-align: center;
  color: #9aa9bd;
  font-size: 13px;
  margin-top: 12px;
}

footer {
  text-align: center;
  color: #8996a8;
  padding: 25px;
}

@media (max-width: 480px) {
  main {
    margin: 12px auto;
    padding: 12px;
  }

  .welcome h1 {
    font-size: 24px;
  }

  form {
    gap: 6px;
  }

  button {
    padding: 12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ UNIVERSAL AI</div>
  <div class="sub">Your Universal Intelligent Assistant</div>
</header>

<main>

<section class="welcome">
  <h1>Salom! Men <span>Universal AI</span></h1>
  <p>Sizning aqlli universal yordamchingiz.</p>
  <p>Istalgan tilda savol bering.</p>
</section>

<div class="chat" id="chat">
  <div class="message">
    Assalomu alaykum! Men Universal AI.
    Sizga qanday yordam bera olaman?
  </div>
</div>

<form id="form">
  <input
    id="question"
    placeholder="Xabaringizni yozing..."
    autocomplete="off"
    required
  >
  <button id="sendButton" type="submit">
    Yuborish
  </button>
</form>

<div class="voice-controls">
  <button id="micButton" type="button">
    🎙️ Gapirish
  </button>

  <button id="voiceButton" type="button">
    🔊 Ovoz yoqilgan
  </button>
</div>

<div class="status" id="status">
  Universal AI tayyor.
</div>

</main>

<footer>© 2026 Universal AI</footer>

<script>
const form = document.getElementById('form');
const chat = document.getElementById('chat');
const input = document.getElementById('question');
const sendButton = document.getElementById('sendButton');
const micButton = document.getElementById('micButton');
const voiceButton = document.getElementById('voiceButton');
const statusBox = document.getElementById('status');

let voiceEnabled = true;
let recognition = null;
let isListening = false;

voiceButton.addEventListener('click', () => {
  voiceEnabled = !voiceEnabled;

  voiceButton.textContent = voiceEnabled
    ? '🔊 Ovoz yoqilgan'
    : '🔇 Ovoz o‘chirilgan';

  if (!voiceEnabled && window.speechSynthesis) {
    speechSynthesis.cancel();
  }
});

function speakText(text) {
  if (!voiceEnabled || !('speechSynthesis' in window)) {
    return;
  }

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = 'uz-UZ';
  speech.rate = 1;
  speech.pitch = 1;

  speechSynthesis.speak(speech);
}

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();

  recognition.lang = 'uz-UZ';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isListening = true;
    micButton.textContent = '🎙️ Tinglayapman...';
    statusBox.textContent = 'Sizni tinglayapman...';
  };

  recognition.onresult = (event) => {
    const spokenText =
      event.results[0][0].transcript;

    input.value = spokenText;
    statusBox.textContent = 'Ovoz matnga aylantirildi.';
    form.requestSubmit();
  };

  recognition.onerror = (event) => {
    statusBox.textContent =
      'Mikrofon xatosi: ' + event.error;
  };

  recognition.onend = () => {
    isListening = false;
    micButton.textContent = '🎙️ Gapirish';
  };

  micButton.addEventListener('click', () => {
    if (isListening) {
      recognition.stop();
      return;
    }

    try {
      recognition.start();
    } catch (error) {
      statusBox.textContent =
        'Mikrofonni qayta ishga tushiring.';
    }
  });

} else {
  micButton.addEventListener('click', () => {
    statusBox.textContent =
      'Brauzeringiz ovozli kiritishni qo‘llab-quvvatlamaydi.';
  });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const message = input.value.trim();

  if (!message) return;

  const user = document.createElement('div');
  user.className = 'message';
  user.textContent = 'Siz: ' + message;
  chat.appendChild(user);

  input.value = '';
  sendButton.disabled = true;

  const loading = document.createElement('div');
  loading.className = 'message';
  loading.textContent =
    'Universal AI javob tayyorlamoqda...';

  chat.appendChild(loading);
  chat.scrollTop = chat.scrollHeight;

  statusBox.textContent = 'AI javob bermoqda...';

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || 'Server xatosi'
      );
    }

    const reply = data.reply || 'Javob olinmadi.';

    loading.textContent = reply;

    statusBox.textContent = 'Javob tayyor.';

    speakText(reply);

  } catch (error) {
    loading.textContent =
      'Server bilan bog‘lanishda xatolik: ' +
      error.message;

    statusBox.textContent = 'Xatolik yuz berdi.';

  } finally {
    sendButton.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
});
</script>

</body>
</html>
